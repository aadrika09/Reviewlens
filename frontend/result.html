<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Your verdict – ReviewLens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;700&display=swap"><link rel="stylesheet" href="style.css"></head><body><div class="bg" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span><span class="e"></span><span class="f"></span></div>
<a class="brand" href="/"><i></i>ReviewLens</a>
<main class="page" id="app"></main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d=JSON.parse(sessionStorage.getItem('rl')||'null'),app=document.getElementById('app');
if(!d){app.innerHTML='<h1>No analysis yet</h1><p class="note"><a href="/">Start one on the home page</a></p>'}
else{const r=d.result,v=r.verdict,i=d.input,fit=Math.max(0,Math.min(100,+v.fit_score||0));
 const label={buy:'Buy it',consider:'Maybe, with caveats',skip:'Skip it'}[v.decision]||v.decision;
 app.innerHTML=`<div class="top"><h1>${esc(i.brand)} ${esc(i.name)}</h1><a href="/">Check another product</a></div>
 <div class="layout"><aside class="verdict"><div class="ring"><svg width="190" height="190" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/>
 <circle class="fg" cx="60" cy="60" r="54" style="--off:${339.3*(1-fit/100)}"/></svg><b>${fit}%</b></div>
 <h2>${label}</h2><p>${esc(v.explanation)}</p>
 <span class="tag ${v.reason_fit?'':'no'}">${v.reason_fit?'Fits your reason to buy':'Does not fit your reason'}</span></aside>
 <div><section class="feats">${r.features.map(f=>`<article class="feat"><h3><span>${esc(f.name)}</span><span>${+f.score}</span></h3>
 <div class="bar"><b style="width:${Math.max(3,Math.min(100,+f.score))}%"></b></div><p>${esc(f.summary)}</p></article>`).join('')}</section>
 <section class="split"><div><h3>What reviewers love</h3><ul>${r.pros.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
 <div><h3>What reviewers complain about</h3><ul>${r.cons.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></section>
 <p class="note">${esc(r.source_note||'')}</p></div></div>`}
</script></body></html>
